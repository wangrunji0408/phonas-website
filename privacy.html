function detectLang() {
  const saved = localStorage.getItem('phonas-lang');
  if (saved && T[saved]) return saved;
  const nav = navigator.language || '';
  if (nav === 'zh-TW' || nav === 'zh-HK' || nav === 'zh-Hant') return 'zh-Hant';
  if (nav.startsWith('zh')) return 'zh-Hans';
  if (nav.startsWith('ja')) return 'ja';
  if (nav.startsWith('ko')) return 'ko';
  if (nav.startsWith('fr')) return 'fr';
  if (nav.startsWith('de')) return 'de';
  if (nav.startsWith('es')) return 'es';
  if (nav.startsWith('ru')) return 'ru';
  if (nav.startsWith('ar')) return 'ar';
  return 'en';
}

function renderContent(lang) {
  const t = T[lang];
  const html = `
    <h1>${t.title}</h1>
    <p class="updated">${t.updated}</p>
    ${t.sections.map(s => `
      <h2>${s.h}</h2>
      <p>${s.p}</p>
      ${s.ul ? '<ul>' + s.ul.map(li => `<li>${li}</li>`).join('') + '</ul>' : ''}
    `).join('')}
  `;
  document.getElementById('privacyContent').innerHTML = html;
}

function applyLang(lang) {
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  document.getElementById('langSelect').value = lang;
  renderContent(lang);
}

function setLang(lang) { localStorage.setItem('phonas-lang', lang); applyLang(lang); }

applyLang(detectLang());
</script>
